<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="chat-shell" aria-labelledby="app-title">
      <header class="topbar">
        <div>
          <p class="eyebrow">OpenAI helper</p>
          <h1 id="app-title">Chatbot Assistant</h1>
        </div>
        <div class="topbar-actions">
          <span class="status-pill" id="status-pill">Ready</span>
          <button class="ghost-button" type="button" id="clear-button">Clear</button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <article class="empty-state" id="empty-state">
          <h2>Start a focused chat</h2>
          <p>Select a task, type a prompt, and the conversation will be remembered on this server.</p>
        </article>
      </section>

      <form class="composer" id="chat-form">
        <label class="task-select">
          <span>Task</span>
          <select id="mode" name="mode">
            <option value="summary">Summary</option>
            <option value="ticket">Ticket</option>
            <option value="resume">Resume</option>
            <option value="review">Review</option>
            <option value="translate">Translate</option>
          </select>
        </label>

        <label class="prompt-field">
          <span>Prompt</span>
          <textarea
            id="prompt"
            name="prompt"
            rows="1"
            placeholder="Message Chatbot Assistant..."
          ></textarea>
        </label>

        <button class="send-button" type="submit" id="submit-button">Send</button>
      </form>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
